apply plugin: 'com.android.application'

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "th.co.central.ris.bootlauncher"
        minSdkVersion 19
        targetSdkVersion 30
        versionCode 82
        versionName "5.51"
    }

    signingConfigs {
        release {
            storeFile     file(System.getenv("KEYSTORE_PATH") ?: "debug.keystore")
            storePassword System.getenv("STORE_PASSWORD")    ?: "android"
            keyAlias      System.getenv("KEY_ALIAS")         ?: "androiddebugkey"
            keyPassword   System.getenv("KEY_PASSWORD")      ?: "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // FileProvider for APK install on Android 7+ (API 24+)
    implementation 'androidx.core:core:1.3.2'
    // OkHttp 3.12.x — last version supporting Android 4.4 (API 19)
    // Bundles its own SSL stack, bypasses system OpenSSL TLS issues
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    // Conscrypt: replaces Android 4.4 system OpenSSL with modern TLS 1.2/1.3
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
}
