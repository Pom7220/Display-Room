name: Generate Keystore (run once)
on:
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-22.04
    steps:
      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore ris-kiosk.jks \
            -alias ris-kiosk \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ris2026kiosk \
            -keypass ris2026kiosk \
            -dname "CN=RIS Kiosk, O=Central Group, C=TH"
          echo "=== KEYSTORE_BASE64 ==="
          base64 -w 0 ris-kiosk.jks
          echo ""
          echo "=== Copy everything between the === lines above ==="
