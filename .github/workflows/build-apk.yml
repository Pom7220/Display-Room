name: Build APK
on:
  push:
    paths:
      - 'boot-launcher/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.2'
      - name: Build debug APK
        working-directory: boot-launcher
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ris-boot-launcher
          path: boot-launcher/app/build/outputs/apk/debug/app-debug.apk
      - name: Commit APK to repo
        run: |
          cp boot-launcher/app/build/outputs/apk/debug/app-debug.apk ris-boot-launcher.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ris-boot-launcher.apk
          git diff --staged --quiet || git commit -m "chore: update ris-boot-launcher.apk [skip ci]"
          git push
