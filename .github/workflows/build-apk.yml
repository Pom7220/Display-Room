name: Build RIS Boot Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'boot-launcher/**'

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-29" \
            "build-tools;29.0.3" 2>/dev/null | tail -3

      - name: Make gradlew executable
        run: chmod +x boot-launcher/gradlew

      - name: Build debug APK
        working-directory: boot-launcher
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RIS-Boot-Launcher-APK
          path: boot-launcher/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
