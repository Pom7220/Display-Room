<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIS Test</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#111;color:#fff;font-size:13px;}
h2{color:#5599ff;padding:12px 16px 8px;font-size:16px;border-bottom:1px solid #222;}
.section{padding:10px 16px;border-bottom:1px solid #1a1a2e;}
.section h3{color:#888;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.row{display:table;width:100%;margin-bottom:6px;}
.btn{display:table-cell;padding:10px 12px;border:none;border-radius:6px 0 0 6px;color:#fff;font-size:12px;font-weight:bold;cursor:pointer;width:55%;vertical-align:middle;text-align:center;}
.btn.blue{background:#2979ff;}
.btn.green{background:#00897b;}
.btn.amber{background:#e65100;}
.btn.purple{background:#6a1b9a;}
.btn.red{background:#c62828;}
.btn.gray{background:#444;}
.btn.full{width:100%;border-radius:6px;}
.res{display:table-cell;padding:6px 8px;background:#0a0a1e;border-radius:0 6px 6px 0;font-size:11px;line-height:1.5;vertical-align:middle;width:45%;border-left:2px solid #222;}
.res.pass{border-left-color:#00e676;color:#00e676;}
.res.fail{border-left-color:#f32b2b;color:#f87171;}
.res.warn{border-left-color:#ff9500;color:#fbbf24;}
.res.info{border-left-color:#5599ff;color:#aac4ff;}
.res.idle{color:#555;}
input{width:100%;padding:8px 10px;background:#1a1a2e;border:1px solid #333;color:#fff;border-radius:6px;font-size:12px;margin-bottom:6px;}
#global-log{padding:10px 16px;max-height:150px;overflow-y:auto;background:#0a0a0a;font-size:11px;line-height:1.7;}
.pass{color:#00e676;}.fail{color:#f32b2b;font-weight:bold;}.warn{color:#fbbf24;}.info{color:#aac4ff;}
</style>
</head>
<body>
<h2>&#9881; RIS Room Display — Test Suite</h2>

<!-- GLOBAL LOG -->
<div id="global-log">Loading...</div>

<div class="section">
<h3>1. Core Browser</h3>
<div class="row">
  <button class="btn blue" onclick="runAllTests()">Run All Core Tests</button>
  <div class="res idle" id="r-core">tap to test</div>
</div>
</div>

<div class="section">
<h3>2. MSAL Auth</h3>
<div class="row">
  <button class="btn green" onclick="testMsalLoad()">MSAL v1 Load</button>
  <div class="res idle" id="r-msal-load">tap to test</div>
</div>
<div class="row">
  <button class="btn green" onclick="testMsalCreate()">MSAL Create Instance</button>
  <div class="res idle" id="r-msal-create">tap to test</div>
</div>
<div class="row">
  <button class="btn green" onclick="testMsalAccount()">Check Saved Account</button>
  <div class="res idle" id="r-msal-acct">tap to test</div>
</div>
</div>

<div class="section">
<h3>3. Save Config</h3>
<input type="text" id="sim-tenant" value="817e531d-191b-4cf5-8812-f0061d89b53d">
<input type="text" id="sim-client" value="80648895-4acf-4ac5-b4a3-c5bf6bc98983">
<input type="text" id="sim-room" value="Macchiato">
<input type="text" id="sim-email" value="rismacchiato@central.co.th">
<div class="row">
  <button class="btn amber" onclick="testSaveConfig()">Simulate Save</button>
  <div class="res idle" id="r-save">tap to test</div>
</div>
<div class="row">
  <button class="btn amber" onclick="testInitMsal()">Full Init Flow</button>
  <div class="res idle" id="r-init">tap to test</div>
</div>
</div>

<div class="section">
<h3>4. Network</h3>
<div class="row">
  <button class="btn purple" onclick="testFetchWeather()">Weather API</button>
  <div class="res idle" id="r-weather">tap to test</div>
</div>
<div class="row">
  <button class="btn purple" onclick="testFetchGraph()">Graph API</button>
  <div class="res idle" id="r-graph">tap to test</div>
</div>
</div>

<div class="section">
<h3>5. Storage</h3>
<div class="row">
  <button class="btn gray" onclick="testStorage()">Show Storage</button>
  <div class="res idle" id="r-storage">tap to test</div>
</div>
<div class="row">
  <button class="btn gray" onclick="clearStorage()">Clear Storage</button>
  <div class="res idle" id="r-clear">tap to test</div>
</div>
</div>

<div class="section">
<h3>6. Login</h3>
<div class="row">
  <button class="btn red" onclick="testDirectLogin()">Trigger MS Login</button>
  <div class="res idle" id="r-login">redirects page...</div>
</div>
</div>

<script src="msal-v1.min.js"></script>
<script>
// ── LOGGING ──
var glog=[];
function log(msg,type){
  glog.push('<span class="'+(type||'info')+'">'+msg+'</span>');
  if(glog.length>30)glog.shift();
  document.getElementById('global-log').innerHTML=glog.join('<br>');
}
function res(id,msg,type){
  var el=document.getElementById(id);
  if(el){el.textContent=msg;el.className='res '+(type||'info');}
  log(id.replace('r-','')+': '+msg,type);
}

window.onerror=function(msg,src,line){
  log('JS ERROR: '+msg+' L:'+line,'fail');return false;
};

// ── CORE TESTS ──
function runAllTests(){
  var pass=0,fail=0,results=[];
  function chk(name,fn){
    try{fn();results.push('+'+name);pass++;}
    catch(e){results.push('-'+name+'('+e.message+')');fail++;}
  }
  chk('JSON',function(){JSON.parse('{"a":1}');});
  chk('localStorage',function(){localStorage.setItem('_t','1');localStorage.removeItem('_t');});
  chk('Promise',function(){new Promise(function(r){r(1);});});
  chk('fetch',function(){if(typeof fetch==='undefined')throw new Error('no fetch');});
  chk('classList',function(){var d=document.createElement('div');d.classList.add('x');});
  chk('Array.find',function(){var f=[1,2].find(function(x){return x===2;});if(!f)throw new Error('no result');});
  chk('Array.filter',function(){[1,2].filter(function(x){return x>1;});});
  chk('atob',function(){atob('aGVsbG8=');});
  chk('Msal',function(){if(typeof Msal==='undefined')throw new Error('not loaded');});
  var cv=(/Chrome\/([\d]+)/.exec(navigator.userAgent)||['','?'])[1];
  var summary=pass+'/'+( pass+fail)+' pass. Chrome '+cv;
  if(fail===0){res('r-core',summary,'pass');}
  else{res('r-core',summary+' FAIL:'+fail,'fail');}
  results.forEach(function(r){log(r,r.charAt(0)==='-'?'fail':'pass');});
}

// ── MSAL TESTS ──
function testMsalLoad(){
  if(typeof Msal==='undefined'){
    res('r-msal-load','NOT LOADED!','fail');
    log('Check msal-v1.min.js uploaded to GitHub','warn');
  } else {
    var keys=Object.keys(Msal);
    var hasUAA=keys.indexOf('UserAgentApplication')>-1;
    res('r-msal-load',hasUAA?'OK - UserAgentApplication found':'keys:'+keys.join(','),hasUAA?'pass':'fail');
  }
}

function testMsalCreate(){
  if(typeof Msal==='undefined'){res('r-msal-create','Msal not loaded','fail');return;}
  try{
    var inst=new Msal.UserAgentApplication({
      auth:{clientId:'80648895-4acf-4ac5-b4a3-c5bf6bc98983',
        authority:'https://login.microsoftonline.com/817e531d-191b-4cf5-8812-f0061d89b53d',
        redirectUri:'https://pom7220.github.io/Display-Room/'},
      cache:{cacheLocation:'localStorage',storeAuthStateInCookie:true}
    });
    inst.handleRedirectCallback(function(){});
    var acct=inst.getAccount();
    res('r-msal-create','OK'+(acct?' acct:'+acct.userName:' no acct'),'pass');
  }catch(e){res('r-msal-create','ERROR: '+e.message,'fail');}
}

function testMsalAccount(){
  var cid='80648895-4acf-4ac5-b4a3-c5bf6bc98983';
  var tok=localStorage.getItem('msal.'+cid+'.access_token');
  var exp=localStorage.getItem('msal.'+cid+'.token_expires');
  var acct=localStorage.getItem('msal.'+cid+'.account');
  if(tok){
    var left=exp?Math.floor((parseInt(exp)-Date.now()/1000)/60):0;
    res('r-msal-acct','token OK, '+left+'min left',left>0?'pass':'warn');
    if(acct){try{var a=JSON.parse(acct);log('Account: '+a.userName,'pass');}catch(e){}}
  } else {
    res('r-msal-acct','No token - login needed','warn');
  }
}

// ── SAVE CONFIG ──
function testSaveConfig(){
  var t=document.getElementById('sim-tenant').value.trim();
  var c=document.getElementById('sim-client').value.trim();
  var r=document.getElementById('sim-room').value.trim();
  var e=document.getElementById('sim-email').value.trim();
  if(!t||!c||!r||!e){res('r-save','Fill all fields!','fail');return;}
  try{
    localStorage.setItem('roomdisplay_v5',JSON.stringify({
      tenant:t,client:c,roomname:r,roomemail:e,
      release:10,booking:true,approval:false,extraRooms:[],teamsBtn:true
    }));
    res('r-save','Saved! '+r+'/'+e.split('@')[0],'pass');
  }catch(ex){res('r-save','Error: '+ex.message,'fail');}
}

function testInitMsal(){
  var saved=localStorage.getItem('roomdisplay_v5');
  if(!saved){res('r-init','No config! Run Simulate Save first','fail');return;}
  var cfg;
  try{cfg=JSON.parse(saved);}catch(e){res('r-init','Config parse error','fail');return;}
  if(typeof Msal==='undefined'){res('r-init','Msal not loaded!','fail');return;}
  try{
    var inst=new Msal.UserAgentApplication({
      auth:{clientId:cfg.client,
        authority:'https://login.microsoftonline.com/'+cfg.tenant,
        redirectUri:'https://pom7220.github.io/Display-Room/'},
      cache:{cacheLocation:'localStorage',storeAuthStateInCookie:true}
    });
    inst.handleRedirectCallback(function(err,resp){
      if(err){res('r-init','Redirect err: '+(err.errorMessage||String(err)),'fail');return;}
      if(resp&&resp.account){res('r-init','LOGIN OK: '+resp.account.userName,'pass');}
    });
    var acct=inst.getAccount();
    if(acct){res('r-init','Cached acct: '+acct.userName,'pass');}
    else{res('r-init','No acct - tap Trigger MS Login','warn');}
  }catch(e){res('r-init','Error: '+e.message,'fail');}
}

// ── NETWORK ──
function testFetchWeather(){
  res('r-weather','fetching...','info');
  fetch('https://api.open-meteo.com/v1/forecast?latitude=13.72&longitude=100.52&current=temperature_2m&timezone=Asia/Bangkok')
  .then(function(r){return r.json();})
  .then(function(d){res('r-weather','OK '+d.current.temperature_2m+'C','pass');})
  .catch(function(e){res('r-weather','BLOCKED (OK to ignore)','warn');});
}

function testFetchGraph(){
  var cid='80648895-4acf-4ac5-b4a3-c5bf6bc98983';
  var tok=localStorage.getItem('msal.'+cid+'.access_token');
  if(!tok){res('r-graph','No token - login first','warn');return;}
  res('r-graph','fetching...','info');
  fetch('https://graph.microsoft.com/v1.0/me',{headers:{Authorization:'Bearer '+tok}})
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.error){res('r-graph','Error: '+d.error.message,'fail');return;}
    res('r-graph','OK: '+d.displayName,'pass');
  })
  .catch(function(e){res('r-graph','Error: '+e.message,'fail');});
}

// ── STORAGE ──
function testStorage(){
  var n=localStorage.length;
  res('r-storage',n+' items in storage','info');
  for(var i=0;i<n;i++){
    var k=localStorage.key(i);
    var v=localStorage.getItem(k);
    log(k+': '+(v&&v.length>40?v.substring(0,40)+'...':v),'info');
  }
}

function clearStorage(){
  localStorage.clear();
  res('r-clear','Cleared!','pass');
}

// ── LOGIN ──
function testDirectLogin(){
  if(typeof Msal==='undefined'){res('r-login','Msal not loaded!','fail');return;}
  var saved=localStorage.getItem('roomdisplay_v5');
  var cfg=saved?JSON.parse(saved):{
    client:'80648895-4acf-4ac5-b4a3-c5bf6bc98983',
    tenant:'817e531d-191b-4cf5-8812-f0061d89b53d'
  };
  res('r-login','redirecting in 1s...','warn');
  setTimeout(function(){
    try{
      var inst=new Msal.UserAgentApplication({
        auth:{clientId:cfg.client,
          authority:'https://login.microsoftonline.com/'+cfg.tenant,
          redirectUri:'https://pom7220.github.io/Display-Room/'},
        cache:{cacheLocation:'localStorage',storeAuthStateInCookie:true}
      });
      inst.loginRedirect({
        scopes:['Calendars.ReadWrite','Calendars.ReadWrite.Shared','Mail.Send','User.Read']
      });
    }catch(e){res('r-login','Error: '+e.message,'fail');}
  },1000);
}

// ── INIT ──
window.onload=function(){
  var cv=(/Chrome\/([\d]+)/.exec(navigator.userAgent)||['','?'])[1];
  log('Chrome '+cv+' Android '+(navigator.userAgent.match(/Android ([\d.]+)/)||['','?'])[1],'info');
  log('Msal: '+(typeof Msal!=='undefined'?'loaded OK':'NOT LOADED'),typeof Msal!=='undefined'?'pass':'fail');
  log('https: '+(location.protocol==='https:'?'OK':'NO - needs https!'),location.protocol==='https:'?'pass':'fail');
  // Auto-run core tests
  runAllTests();
};
</script>
</body>
</html>
